<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('syncine-theme-mode');
          var isDark = true;
          if (mode === 'light') {
            isDark = false;
          } else if (mode === 'dark') {
            isDark = true;
          } else {
            // Real-time auto mode: Daytime 06:00 to 18:30 is light, else dark
            var now = new Date();
            var totalMinutes = now.getHours() * 60 + now.getMinutes();
            isDark = !(totalMinutes >= 360 && totalMinutes < 1110);
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
